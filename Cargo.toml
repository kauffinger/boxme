[package]
name = "boxme"
version = "0.10.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Local backend only. No `cloud`, and no `download-binaries`: that installs the
# runtime into the *build* machine's ~/.microsandbox at compile time, which is
# useless for a released binary — `boxme setup` installs it on the user's host.
microsandbox = { version = "0.7", default-features = false, features = ["local", "net", "keyring"] }
# Types only (SecretEntry, policy). The network engine lives in the `msb`
# runtime binary since 0.7, so don't compile it into boxme.
microsandbox-network = { version = "0.7", default-features = false }
ratatui = "0.29"
crossterm = "0.29"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
notify = "8"
libc = "0.2"
